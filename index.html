function backupFingerprint(){
  const data=JSON.stringify(workspace.projects);
  let hash=2166136261;
  for(let i=0;i<data.length;i++)hash=Math.imul(hash^data.charCodeAt(i),16777619);
  return hash>>>0;
}
function renderBackupStatus(){
  const badge=$('backupStatus');
  const time=lastBackup?.time;
  const hasBackup=Number.isFinite(time)&&time>0;
  const recommended=hasBackup&&Date.now()-time>=backupReminderAge&&lastBackup.fingerprint!==backupFingerprint();
  badge.classList.toggle('backupDue',recommended);
  const formatted=hasBackup?new Intl.DateTimeFormat('en-GB',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Dhaka'}).format(time):'';
  badge.textContent=recommended?'Backup recommended':hasBackup?'Last backup started: '+formatted:'No backup yet';

}

function qaDate(){

const qaActivityTypes=['Test results','New defects','Verified fixes'];
function recordQAActivity(item,previous){
  const add=(type,detail)=>{
    state.qaActivity??=[];
    state.qaActivity.push({date:qaDate(),type,id:item.id,title:item.title,detail});
  };
  if(item.kind==='Test case'&&item.execution!=='Not Run'&&item.execution!==previous?.execution)
    add('Test results',item.execution);
  if(item.kind==='Defect'&&previous?.kind!=='Defect')add('New defects',item.severity||item.defect||'');
  if(item.regression==='Verified Fix'&&previous?.regression!=='Verified Fix')add('Verified fixes','');
}
function dailyQAText(date){
  const logged=(state.qaActivity??[]).filter(event=>event.date===date);
  const retestItems=state.rows.filter(item=>item.kind==='Defect').flatMap(item=>
    retests(item).filter(entry=>entry.date===date).map(entry=>item.id+' · '+item.title+' · '+entry.result+' · '+entry.build+' · '+entry.environment+(entry.evidence?' · '+entry.evidence:'')));
  const groups=qaActivityTypes.map(type=>[type,logged.filter(e=>e.type===type).map(e=>e.id+' · '+e.title+(e.detail?' · '+e.detail:''))]);
  groups.push(['Retests',retestItems]);
  return ['Daily QA Summary · '+date,workspace.projects[workspace.active].name,
    ...groups.map(([title,entries])=>title+' ('+entries.length+')\n'+(entries.length?entries.map(line=>'- '+line).join('\n'):'No entries recorded.'))].join('\n\n');
}

function renameEntry(kind,parent,current,name){
  if(!current||!name||name.length>80||current===name)return 'Choose a name and enter a different new name.';
  const choices=kind==='Project'?workspace.projects.map(p=>p.name):kind==='Module'?modules:parent?subModules(parent):[];
  if(!choices.includes(current))return 'Select a current name.';
  if(choices.some(x=>x!==current&&x.trim().toLowerCase()===name.toLowerCase()))return 'That name already exists here.';
  if(kind==='Project'){
    workspace.projects.find(p=>p.name===current).name=name;
    return '';
  }
  const projectRows=[...state.rows,...state.templates,...(state.customSubModules??[])];
  if(kind==='Module'){
    if(!state.emptyCatalog){
      state.customModules=[...modules];
      state.saved=[...defaultFilters.filter(f=>!state.saved.some(saved=>saved.name===f.name)).map(f=>({...f,filters:{...f.filters}})),...state.saved];
      state.emptyCatalog=true;
    }
    state.customModules=state.customModules.map(module=>module===current?name:module);
    projectRows.forEach(row=>{if(row.module===current)row.module=name;});
    for(const filter of [filters,...state.saved.map(f=>f.filters)])if(filter.module===current)filter.module=name;
    syncModules();
  }else{
    projectRows.forEach(row=>{if(row.module===parent&&row.sub===current)row.sub=name;});
    for(const filter of [filters,...state.saved.map(f=>f.filters)]){
      if(filter.sub===current&&(filter.module===parent||(!filter.module&&!modules.some(m=>m!==parent&&subModules(m).includes(current)))))filter.sub=name;
    }
  }
  return '';
}

function validateBackup(backup){
  const object=x=>x!==null&&typeof x==='object'&&!Array.isArray(x);
  const strings=x=>object(x)&&Object.values(x).every(v=>typeof v==='string');
  if(!object(backup)||backup.format!=='qa-regression-desk'||backup.version!==1)
    throw new Error('Select a QA Workspace JSON backup (version 1).');
  const {rows,templates,saved,customModules=[],customSubModules=[],emptyCatalog=false,qaActivity=[]}=backup.data??{};
  if(typeof emptyCatalog!=='boolean')throw new Error('Invalid project module catalog.');
  const names=new Set(emptyCatalog?[]:defaultModules.map(name=>name.toLowerCase()));
  if(!Array.isArray(customModules)||!customModules.every(name=>{
    if(typeof name!=='string'||!name.trim()||name!==name.trim()||name.length>80||names.has(name.toLowerCase()))return false;
    names.add(name.toLowerCase());return true;
  }))throw new Error('Backup contains invalid or duplicate module names.');
  const backupModules=[...(emptyCatalog?[]:defaultModules),...customModules];
  if(!Array.isArray(rows)||!Array.isArray(templates)||!Array.isArray(saved))
    throw new Error('Backup is missing records, templates or saved filters.');
  const ids=new Set();
  for(const row of rows){
    if(!strings(row)||!row.id?.trim()||!row.title?.trim()||!backupModules.includes(row.module)||
      !['Test case','Defect'].includes(row.kind)||!options.execution.includes(row.execution))
      throw new Error('Backup contains an invalid record.');
    const id=row.id.trim().toLowerCase();
    if(ids.has(id))throw new Error('Backup contains duplicate record IDs.');
    ids.add(id);
  }
  if(!templates.every(t=>strings(t)&&t.title?.trim()&&backupModules.includes(t.module))||
     !saved.every(s=>object(s)&&typeof s.name==='string'&&s.name.trim()&&views.includes(s.view)&&strings(s.filters)))
    throw new Error('Backup contains an invalid template or saved filter.');
  const subKeys=new Set();
  if(!Array.isArray(customSubModules)||!customSubModules.every(item=>{
    if(!strings(item)||!backupModules.includes(item.module)||!item.sub?.trim()||item.sub!==item.sub.trim()||item.sub.length>80)return false;
    const id=JSON.stringify([item.module,item.sub.toLowerCase()]);
    if(subKeys.has(id))return false;
    subKeys.add(id);return true;
  }))throw new Error('Backup contains invalid or duplicate sub-modules.');
  if(!Array.isArray(qaActivity)||!qaActivity.every(e=>strings(e)&&[e.date,e.type,e.id,e.title,e.detail].every(v=>typeof v==='string')&&qaActivityTypes.includes(e.type)&&/^\d{4}-\d{2}-\d{2}$/.test(e.date)))
    throw new Error('Invalid daily QA activity.');
  return {rows,templates,saved,customModules,customSubModules,emptyCatalog,qaActivity};
}
function validateWorkspaceBackup(backup){
  if(backup?.version!==2)return wrapLegacy(validateBackup(backup));
  const projects=backup.data?.projects,active=backup.data?.active;
  if(backup.format!=='qa-regression-desk'||!Array.isArray(projects)||!Number.isInteger(active)||active<0||active>=projects.length)
    throw new Error('Invalid project backup.');
  const names=new Set();
  return {active,projects:projects.map(project=>{
    const name=project?.name;
    if(typeof name!=='string'||!name.trim()||name.trim()!==name||name.length>80||names.has(name.toLowerCase()))
      throw new Error('Invalid or duplicate project name.');
    names.add(name.toLowerCase());
    return {name,data:validateBackup({format:backup.format,version:1,data:project.data})};
  })};
}
